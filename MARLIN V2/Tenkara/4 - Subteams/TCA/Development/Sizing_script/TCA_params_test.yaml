### TCA Setpoints - Used by Sizing Script ###

propellants:
  fuel: Ethanol
  oxidizer: LOX

densities:
  fuel: 789  # Density of Ethanol (kg/m^3)
  oxidizer: 1141  # Density of LOX (kg/m^3)

Thrust_target: 2600   # Thrust (lbf)
Chamber_pressure: 600   # Chamber pressure (psi)

Exit_pressure: 12  # Exit pressure (psi)

cstar_efficiency: 0.875  # C* efficiency
cf_efficiency: 0.875  # Cf efficiency

L_star: 1  # Characteristic length (m)
alpha_divergence: 45.0     # Divergence half-angle (degrees)

chamber_diameter: 3.826  # Chamber diameter (in)
chamber_thickness: 0.337  # Chamber wall thickness (in)
throat_diameter: 2.0219  # Throat diameter (in)
exit_diameter: 5.2316  # Exit diameter (in)

chamber_length: 0.2650  # Chamber length (m)
ox_distance: 3  # Distance between LOX holes to the fuel hole in a O-F-O configuration (mm)
impinge_percentage: 0.02  # % of impingement relative to chamber length

contraction_ratio: 3.5860  # Contraction ratio
expansion_ratio: 6.6952  # Expansion ratio

cstar: 1461.58  # C* (m/s)
cf: 1.3497  # Cf
isp: 201.15  # Specific impulse (s)

tp_mdot: 5.8629  # Mass flow rate (kg/s)
of_ratio: 1.2  # O/F ratio 

discharge_coeff:
  oxidizer: 0.8  # Discharge coefficient for LOX
  fuel: 0.8  # Discharge coefficient for fuel

hole_number:
  oxidizer: 72  # Number of holes for LOX
  fuel: 36  # Number of holes for fuel

hole_diameters:
  oxidizer: 1.2  # Orifice diameter for LOX (mm)
  fuel: 1.7  # Orifice diameter for fuel (mm)

wall_thickness:
  fuel: 6  # Wall thickness for fuel holes (mm)
  oxidizer: 9  # Wall thickness for oxidizer holes (mm)


