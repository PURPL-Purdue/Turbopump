#######################################################################################
# Propellants @ OF and Propreties
# =====================================================================================

propellants:
  fuel:
    name: "IPA(L)"                                  # Liquid IPA — not in thermo.lib, so built as a custom card.
    formula: {C: 3.0, H: 8.0, O: 1.0}
    molecular_weight: 60.096                        # g/mol
    enthalpy: -318.1                                 # kJ/mol, liquid, 298.15 K
    enthalpy_units: "kJ/mol"                         # matches the documented cea.Reactant example exactly
    temperature: 298.15
  oxidizer: O2(L)                                    # LOx
  
densities:
  fuel: 786                                                                          # Density of Isopropanol (kg/m^3)
  oxidizer: 1141                                                                     # Density of LOX (kg/m^3)

reactant_T:                                                                          # Reactant Temperatures (K)
  fuel: 298.15
  oxidizer: 90.17

of_ratio: 1                                                                          # O/F ratio
tp_mdot: 3.8050                                                                      # Resultant mdot to achieve target thrust (kg/s) CHANGED


#######################################################################################
# Engine Setpoints
# =====================================================================================
 
Thrust_target: 1400                                                                   # Thrust (lbf)
chamber_pressure: 440.0                                                               # Chamber pressure (psi)
 
exit_pressure: 18                                                                     # Exit pressure (psi) 
 
cstar_efficiency: 0.875                                                               # C* efficiency
cf_efficiency: 0.875                                                                  # Cf efficiency
 
L_star: 1                                                                             # Characteristic length (m) 
l_percent: 80                                                                         # (60/80/90)
alpha_divergence: 45.0                                                                # Divergence half-angle (degrees)
 
 
#######################################################################################
# Efficiency metrics
# =====================================================================================
 
cstar: 1310.665                                                                        # C* (m/s)
cf: 1.249                                                                              # Cf
isp: 166.892                                                                           # Specific impulse (s)
 
 
#######################################################################################
# Engine Contour Sizing
# =====================================================================================
 
chamber_diameter: 3.826                                                                # Chamber diameter (in)
chamber_thickness: 0.337                                                               # Chamber wall thickness (in)
throat_diameter: 1.8012                                                                # Throat diameter (in) CHECKED
exit_diameter: 3.5367                                                                  # Exit diameter (in) CHECKED
chamber_length: 0.2328                                                                 # Chamber length (m) (FROM INJECTOR TO THROAT) CHECKED

contraction_ratio: 4.512                                                               # Contraction ratio
expansion_ratio: 3.855                                                                 # Expansion ratio

chamber_Temperature: 2016.961                                                          # Adiabatic flame temperature @ chamber [K]
#######################################################################################
# Injector Sizing
# =====================================================================================

discharge_coeff:
  oxidizer: 0.8                                                                       # Discharge coefficient for LOX
  fuel: 0.8                                                                           # Discharge coefficient for fuel

hole_number:
  oxidizer: 72                                                                        # Number of holes for LOX
  fuel: 36                                                                            # Number of holes for fuel

hole_diameters:
  oxidizer: 1.041                                                                     # Orifice diameter for LOX (mm)
  fuel: 1.5                                                                           # Orifice diameter for fuel (mm)

ox_distance: 3                                                                        # Distance between LOX holes to the fuel hole in a O-F-O configuration (mm)
ox_ offset: 5.44                                                                      # Distance of the Ox hole to generate the impingement angle at given thickness (mm)

impinge_percentage: 0.02                                                              # % of impingement relative to chamber length
ox_angle_impingement: 31.15                                                           # Angle of impingement for LOX (degrees)

wall_thickness:
  fuel: 6                                                                             # Wall thickness for fuel holes (mm)
  oxidizer: 9                                                                         # Wall thickness for oxidizer holes (mm)

stifness:
  fuel: 23.1                                                                           # Stiffness for fuel (%)
  oxidizer: 31.2                                                                       # Stiffness for oxidizer (%)
